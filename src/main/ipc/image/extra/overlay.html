<!doctype html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        overflow: hidden !important;
      }
      #selection-box {
        position: absolute;
        border: 2px dashed #09f;
        background: rgba(0, 153, 255, 0.1);
        pointer-events: none;
      }
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <div id="overlay"></div>
    <div id="selection-box"></div>
    <script src="overlay.js"></script>
  </body>
</html>
